<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Found-Pet Reports — PetCare Passport</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
        <span>PetCare <span class="text-success">Passport</span></span>
      </div>
      <div class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="pets.html" class="sidebar-link"><i class="bi bi-heart-pulse-fill"></i> My Pets</a>
        <a href="health-records.html" class="sidebar-link"><i class="bi bi-journal-medical"></i> Health Records</a>
        <a href="add-pet.html" class="sidebar-link"><i class="bi bi-plus-circle-fill"></i> Add New Pet</a>
        <a href="reminders.html" class="sidebar-link"><i class="bi bi-alarm-fill"></i> Reminders</a>
        <a href="qr-code.html" class="sidebar-link"><i class="bi bi-qr-code"></i> QR Emergency Tags</a>
        <a href="found-reports.html" class="sidebar-link active"><i class="bi bi-geo-alt-fill"></i> Found-Pet Reports</a>
        <a href="profile.html" class="sidebar-link"><i class="bi bi-person-circle"></i> Owner Profile</a>
      </div>
      <div class="sidebar-footer">
        <div class="d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-2 overflow-hidden">
            <div class="rounded-circle bg-success-subtle text-success p-2 fw-bold" style="width: 38px; height: 38px; display:flex; align-items:center; justify-content:center;">
              <i class="bi bi-person-fill"></i>
            </div>
            <div class="overflow-hidden">
              <div class="current-user-name fw-bold small text-truncate text-dark">Owner</div>
              <div class="current-user-email text-muted text-xs text-truncate" style="font-size: 0.75rem;">owner@example.com</div>
            </div>
          </div>
          <button class="btn btn-outline-danger btn-sm btn-logout" title="Log Out"><i class="bi bi-box-arrow-right"></i></button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="app-main">
      <header class="app-header">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-light d-lg-none p-2 border" id="sidebarToggleBtn"><i class="bi bi-list fs-5"></i></button>
          <div>
            <h5 class="mb-0 fw-bold">Found-Pet Incident Reports</h5>
            <small class="text-muted">Direct alerts received when finders scan your pets' QR collar tags</small>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-light btn-sm border" onclick="loadFoundReports()">
            <i class="bi bi-arrow-clockwise"></i> Refresh
          </button>
        </div>
      </header>

      <div class="app-content">
        <!-- Status Filter Bar -->
        <div class="custom-card p-3 mb-4 bg-white">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-primary-custom filter-status-btn active" data-status="all">All Reports</button>
              <button class="btn btn-sm btn-light border filter-status-btn" data-status="pending">Pending</button>
              <button class="btn btn-sm btn-light border filter-status-btn" data-status="contacted">In Contact</button>
              <button class="btn btn-sm btn-light border filter-status-btn" data-status="resolved">Resolved / Reunited</button>
            </div>
            <div class="text-muted small" id="reportCountText">Showing 0 reports</div>
          </div>
        </div>

        <!-- Reports List Container -->
        <div class="row g-4" id="reportsContainer">
          <div class="col-12 text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/found-reports.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account — PetCare Passport</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-cream">

  <!-- Navbar -->
  <nav class="navbar public-navbar">
    <div class="container">
      <a class="navbar-brand" href="/">
        <div class="brand-icon d-inline-flex p-2 bg-success-subtle text-success rounded-3 me-2">
          <i class="bi bi-shield-check fs-4"></i>
        </div>
        <span>PetCare <span class="text-success">Passport</span></span>
      </a>
      <a href="/login.html" class="btn btn-outline-custom btn-sm">Existing Owner? Sign In</a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-6">
        <div class="form-card shadow-lg">
          <div class="text-center mb-4">
            <div class="stat-icon green mx-auto mb-3">
              <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3 class="fw-bold">Create Owner Account</h3>
            <p class="text-muted small">Register your profile to safeguard your pets' health and emergency records</p>
          </div>

          <!-- Alert box for errors -->
          <div id="registerAlert" class="alert alert-danger d-none small py-2" role="alert"></div>

          <form id="registerForm" novalidate>
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="fullName" placeholder="Sarah Jenkins" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" placeholder="sarah@example.com" required>
                </div>
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                  <input type="tel" class="form-control" id="phone" placeholder="+1 (555) 000-1234" required>
                </div>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" placeholder="At least 6 chars" required minlength="6">
                </div>
              </div>
              <div class="col-md-6">
                <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                  <input type="password" class="form-control" id="confirmPassword" placeholder="Re-type password" required minlength="6">
                </div>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
              <label class="form-check-label small text-muted" for="termsCheck">
                I agree to the <a href="/#privacy" class="text-success">Terms of Service & Privacy Shield</a>
              </label>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2" id="submitBtn">
              <span id="btnText">Complete Registration</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-0">
              Already registered? <a href="/login.html" class="fw-bold text-success">Sign in here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const registerForm = document.getElementById('registerForm');
    const registerAlert = document.getElementById('registerAlert');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      registerAlert.classList.add('d-none');

      const full_name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirmPassword').value;
      const termsCheck = document.getElementById('termsCheck').checked;

      if (!full_name || !email || !phone || !password || !confirm_password) {
        registerAlert.textContent = 'Please fill out all required fields.';
        registerAlert.classList.remove('d-none');
        return;
      }

      if (password.length < 6) {
        registerAlert.textContent = 'Password must be at least 6 characters.';
        registerAlert.classList.remove('d-none');
        return;
      }

      if (password !== confirm_password) {
        registerAlert.textContent = 'Passwords do not match. Please verify both entries.';
        registerAlert.classList.remove('d-none');
        return;
      }

      if (!termsCheck) {
        registerAlert.textContent = 'Please agree to the Terms of Service & Privacy Shield.';
        registerAlert.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = 'Creating account...';
      btnSpinner.classList.remove('d-none');

      try {
        const response = await apiRequest('/auth/register', {
          method: 'POST',
          body: { full_name, email, phone, password, confirm_password }
        });

        showToast('Account registered successfully! Welcome to PetCare Passport.', 'success');

        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 800);
      } catch (err) {
        registerAlert.textContent = err.message || 'Registration failed. Please check your information.';
        registerAlert.classList.remove('d-none');
        submitBtn.disabled = false;
        btnText.textContent = 'Complete Registration';
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>

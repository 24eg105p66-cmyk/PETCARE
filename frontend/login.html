<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PetCare Passport</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-cream">

  <!-- Navbar -->
  <nav class="navbar public-navbar">
    <div class="container">
      <a class="navbar-brand" href="/">
        <div class="brand-icon d-inline-flex p-2 bg-success-subtle text-success rounded-3 me-2">
          <i class="bi bi-shield-check fs-4"></i>
        </div>
        <span>PetCare <span class="text-success">Passport</span></span>
      </a>
      <a href="/register.html" class="btn btn-outline-custom btn-sm">Create Account</a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="form-card shadow-lg">
          <div class="text-center mb-4">
            <div class="stat-icon green mx-auto mb-3">
              <i class="bi bi-box-arrow-in-right"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted small">Sign in to manage your pets' health records and QR tags</p>
          </div>

          <!-- Alert box for errors -->
          <div id="loginAlert" class="alert alert-danger d-none small py-2" role="alert"></div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="sarah@petcare.com" required autocomplete="username">
              </div>
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
                <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" title="Toggle password visibility">
                  <i class="bi bi-eye" id="toggleIcon"></i>
                </button>
              </div>
              <div class="invalid-feedback">Password is required.</div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label small text-muted" for="rememberMe">
                  Remember me for 30 days
                </label>
              </div>
              <a href="#" class="small text-muted" onclick="showDemoCredentials(event)">Demo Login?</a>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2" id="submitBtn">
              <span id="btnText">Sign In to Dashboard</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-0">
              Don't have an account yet? <a href="/register.html" class="fw-bold text-success">Register here</a>
            </p>
          </div>
        </div>

        <!-- Quick Demo Credential Card -->
        <div class="p-3 bg-white border rounded-3 mt-3 text-center small shadow-sm">
          <span class="text-muted">Quick Demo Login: </span>
          <button type="button" class="btn btn-link btn-sm p-0 fw-semibold text-success" onclick="fillDemoCredentials()">
            Click here to fill Demo credentials (Sarah Jenkins)
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Password visibility toggle
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      toggleIcon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    });

    function fillDemoCredentials() {
      document.getElementById('email').value = 'sarah@petcare.com';
      document.getElementById('password').value = 'Password@123';
      showToast('Demo credentials pre-filled!', 'info');
    }

    function showDemoCredentials(e) {
      e.preventDefault();
      fillDemoCredentials();
    }

    // Form Submission
    const loginForm = document.getElementById('loginForm');
    const loginAlert = document.getElementById('loginAlert');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginAlert.classList.add('d-none');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember_me = document.getElementById('rememberMe').checked;

      if (!email || !password) {
        loginAlert.textContent = 'Please enter both your email address and password.';
        loginAlert.classList.remove('d-none');
        return;
      }

      // UI Loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Authenticating...';
      btnSpinner.classList.remove('d-none');

      try {
        const response = await apiRequest('/auth/login', {
          method: 'POST',
          body: { email, password, remember_me }
        });

        showToast('Login successful! Redirecting...', 'success');

        const redirect = getQueryParam('redirect') || '/dashboard.html';
        setTimeout(() => {
          window.location.href = redirect;
        }, 600);
      } catch (err) {
        loginAlert.textContent = err.message || 'Login failed. Please check your credentials.';
        loginAlert.classList.remove('d-none');
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In to Dashboard';
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
